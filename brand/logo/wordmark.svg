<!--
  The Lorekeeper wordmark: drawn, not typeset.
  Lorekeeper identity 0.1.0, approved 2026-09-18. See brand/IDENTITY.md for usage rules.
  Colours are read from the token custom properties in brand/tokens/tokens.css,
  with the light-variant value as the fallback so the file also stands alone.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 876.23 100" width="876.23" height="100" role="img" aria-labelledby="lk-wordmark-title">
  <title id="lk-wordmark-title">Lorekeeper</title>
  <!-- Constructed monoline capitals on a 100-unit cap height with a 10-unit
       stroke and 24 units of tracking. These letterforms are original geometry,
       not outlines taken from a typeface, so this repository redistributes no
       font. Widths follow classical proportions: a circular O, narrow L and E,
       a shortened middle arm on the E.
       The viewBox is the ink box, not the path box: the widest point is the
       final R's leg, whose centreline ends at x=872.09 but whose stroke carries
       4.13 further out, so the box is 876.23 wide and flush with the ink on
       both sides. Every diagonal's endpoint is likewise stated so the stroke
       edge lands exactly on the cap line or the baseline. -->
  <g fill="none" stroke="var(--lk-ink, #1B1C2E)" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M 5,0 L 5,100"/>
      <path d="M 0,95 L 58,95"/>
      <ellipse cx="130" cy="50" rx="43" ry="45"/>
      <path d="M 207,0 L 207,100"/>
      <path d="M 207,5 L 234,5 A 23,23 0 0 1 234,50 L 207,50"/>
      <path d="M 232,50 L 264.09,97.18833"/>
      <path d="M 295,0 L 295,100"/>
      <path d="M 290,5 L 352,5"/>
      <path d="M 290,50 L 344,50"/>
      <path d="M 290,95 L 352,95"/>
      <path d="M 381,0 L 381,100"/>
      <path d="M 386,52 L 438.05,3.66383"/>
      <path d="M 386,52 L 437.57,96.20374"/>
      <path d="M 471,0 L 471,100"/>
      <path d="M 466,5 L 528,5"/>
      <path d="M 466,50 L 520,50"/>
      <path d="M 466,95 L 528,95"/>
      <path d="M 557,0 L 557,100"/>
      <path d="M 552,5 L 614,5"/>
      <path d="M 552,50 L 606,50"/>
      <path d="M 552,95 L 614,95"/>
      <path d="M 643,0 L 643,100"/>
      <path d="M 643,5 L 670,5 A 25,25 0 0 1 670,54 L 643,54"/>
      <path d="M 729,0 L 729,100"/>
      <path d="M 724,5 L 786,5"/>
      <path d="M 724,50 L 778,50"/>
      <path d="M 724,95 L 786,95"/>
      <path d="M 815,0 L 815,100"/>
      <path d="M 815,5 L 842,5 A 23,23 0 0 1 842,50 L 815,50"/>
      <path d="M 840,50 L 872.09,97.18833"/>
  </g>
</svg>
