name: CI

# The Feature requires CI on pull requests. Trunk-based development with
# squash merges means main can still break after a merge, but adding a push
# trigger is a workflow decision that belongs to the human, not to this file.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux only. Windows is explicitly out of scope for v0.1.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines floor in package.json.
          node-version: 24
          cache: npm

      # The Wonder Wagon foundations are `file:` devDependencies on a sibling
      # checkout until they publish, so CI recreates that sibling at a pinned
      # commit and builds the two packages brand/terminal/build.mjs reads.
      # Nothing at runtime depends on them. Bump the ref together with
      # `npm run brand:terminal`.
      - name: Check out the Wonder Wagon foundations beside this repository
        env:
          WONDER_WAGON_UI_REF: ae940492ddce1419ba29f0d04b468a042004a06a
        run: |
          git clone --quiet --no-checkout https://github.com/rikilamadrid/wonder-wagon-ui.git ../wonder-wagon-ui
          git -C ../wonder-wagon-ui checkout --quiet "$WONDER_WAGON_UI_REF"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ../wonder-wagon-ui/package.json

      - name: Build @wonder-wagon/tokens and @wonder-wagon/themes
        working-directory: ../wonder-wagon-ui
        run: |
          bun install --frozen-lockfile
          bun run --filter '@wonder-wagon/tokens' build
          bun run --filter '@wonder-wagon/themes' build

      # This also runs the prepare script in packages/cli, which builds and
      # links the lore binary.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The generated favicons, application icons, and social preview claim to
      # be reproducible build products of brand/logo/ and the token source.
      # Running the check on both runners, on a Node the assets were not
      # generated with, is what makes that a fact rather than a claim.
      - name: Verify the generated identity assets reproduce
        run: npm run brand:assets:check

      # The CLI's accent and serial are generated from brand/tokens/tokens.json
      # and the Wonder Wagon theme. This fails if the committed module is stale
      # or if any colour the foundation's theme copies from tokens.json has
      # drifted (nine values, the same map as its proof/lorekeeper.ts).
      - name: Verify the terminal identity is current
        run: npm run brand:terminal:check

      # The README's header pair and terminal specimen are generated from the
      # lockup, the token source, and a recording of lore --help. This fails if
      # a generated file is stale or if the recording no longer matches what
      # the built binary prints.
      - name: Verify the README identity is current
        run: npm run brand:readme:check

      - name: Verify the built binary runs
        run: |
          ./node_modules/.bin/lore --version
          ./node_modules/.bin/lore --help

      # The published package is self-contained: the private @lorekeeper/core
      # workspace is inlined into dist/lore.js. This packs the tarball `npm
      # publish` would upload, checks its files, manifest and imports, installs
      # it into a clean prefix, and runs the installed `lore`.
      - name: Verify the npm package
        run: node packages/cli/scripts/verify-package.mjs
