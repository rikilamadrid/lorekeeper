<!--
  Three surfaces, cleanly separated: this toolkit repository, your private
  generated brain, and the public documentation site.
  Lorekeeper identity 0.1.0. See brand/diagrams.md for the text alternative
  and brand/IDENTITY.md for the usage rules.

  Colours are the token custom properties from brand/tokens/tokens.css, each
  with its light-variant value as the literal fallback. Standing alone this
  file is its own document, so `svg:root` matches and it carries the palette
  itself, dark variant included. Inlined into a themed page `svg:root` matches
  nothing, the page's tokens win, and the fallbacks never fire. Verified by
  `node brand/diagrams/check.mjs`.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620"
     role="img" aria-labelledby="lk-d-ts-title lk-d-ts-desc">
  <title id="lk-d-ts-title">The three surfaces Lorekeeper keeps separate</title>
  <desc id="lk-d-ts-desc">Two public surfaces sit above a dashed boundary line, and one private surface sits below it. Above: this repository, `lorekeeper/`, holding the CLI, its contracts and its tests, the identity, the narrative and this diagram, and no brain data ever; and the documentation site, which renders what this repository authors, is static and installable, and holds no brain data. An arrow runs from the repository to the documentation site, labelled builds. The dashed boundary reads: no brain data crosses this line, nothing private is committed here. Below it: your brain, at a path such as ~/brain, holding your Markdown files and the manifest that says which of them the toolkit owns — private, on your machine, generated by `lore init`, and never committed to this repository. One arrow crosses the boundary downwards, through a gap in the line, from the repository into your brain: it carries `lore init`, `lore capture` and `lore search`, which run on your machine. A second arrow, from your brain back up to the documentation site, is struck through with a cross on the boundary and labelled: your notes never cross; the CLI makes no network call. So code crosses the boundary in one direction, and brain data crosses it in neither.</desc>

  <style>
    svg:root {
      --lk-page: #FAF7F1;
      --lk-surface: #FFFFFF;
      --lk-surface-2: #F0EAE0;
      --lk-ink: #1B1C2E;
      --lk-muted: #55566B;
      --lk-line-strong: #7D7885;
      --lk-accent: #343A8C;
      --lk-no: #A32A1F;
    }
    @media (prefers-color-scheme: dark) {
      svg:root {
        --lk-page: #141521;
        --lk-surface: #1C1E2C;
        --lk-surface-2: #262939;
        --lk-ink: #EDE7DB;
        --lk-muted: #ABA7B8;
        --lk-line-strong: #71748F;
        --lk-accent: #99A2F0;
        --lk-no: #F2908A;
      }
    }

    .lk-d-page { fill: var(--lk-page, #FAF7F1); }
    .lk-d-band { fill: var(--lk-surface-2, #F0EAE0); }
    .lk-d-node { fill: var(--lk-surface, #FFFFFF); stroke: var(--lk-line-strong, #7D7885); stroke-width: 1.5; }

    .lk-d-flow { fill: none; stroke: var(--lk-accent, #343A8C); stroke-width: 2; }
    .lk-d-head { fill: var(--lk-accent, #343A8C); }
    .lk-d-blocked { fill: none; stroke: var(--lk-no, #A32A1F); stroke-width: 2; }
    .lk-d-head-no { fill: var(--lk-no, #A32A1F); }
    .lk-d-boundary { fill: none; stroke: var(--lk-no, #A32A1F); stroke-width: 2; stroke-dasharray: 6 6; }
    .lk-d-cross { fill: none; stroke: var(--lk-no, #A32A1F); stroke-width: 3; stroke-linecap: round; }

    text { font-family: var(--lk-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif); }
    .lk-d-h1 { font-family: var(--lk-display, "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif); font-size: 24px; fill: var(--lk-ink, #1B1C2E); }
    .lk-d-sub { font-size: 13.5px; fill: var(--lk-muted, #55566B); }
    .lk-d-step { font-size: 12px; font-weight: 650; letter-spacing: 0.08em; fill: var(--lk-accent, #343A8C); }
    .lk-d-strong { font-size: 15px; font-weight: 650; fill: var(--lk-ink, #1B1C2E); }
    .lk-d-note { font-size: 13px; fill: var(--lk-muted, #55566B); }
    .lk-d-note-sm { font-size: 12.5px; fill: var(--lk-muted, #55566B); }
    .lk-d-foot { font-size: 12.5px; fill: var(--lk-muted, #55566B); }
    .lk-d-warn { font-size: 13px; font-weight: 650; fill: var(--lk-no, #A32A1F); }
    .lk-d-code-muted { font-family: var(--lk-mono, ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace); font-size: 12px; fill: var(--lk-muted, #55566B); }
    .lk-d-code-accent { font-family: var(--lk-mono, ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace); font-size: 12px; fill: var(--lk-accent, #343A8C); }
    .lk-d-mid { text-anchor: middle; }
  </style>

  <defs>
    <marker id="lk-d-ts-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,1 L 9,5 L 0,9 Z" class="lk-d-head"/>
    </marker>
    <marker id="lk-d-ts-arrow-no" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0,1 L 9,5 L 0,9 Z" class="lk-d-head-no"/>
    </marker>
  </defs>

  <rect class="lk-d-page" width="960" height="620"/>

  <text class="lk-d-h1" x="48" y="44">Three surfaces, cleanly separated</text>
  <text class="lk-d-sub" x="48" y="68">Two are public and one is yours. What crosses between them is code, in one direction only.</text>

  <text class="lk-d-step" x="48" y="96">PUBLIC</text>

  <rect class="lk-d-node" x="48" y="108" width="384" height="176" rx="8"/>
  <text class="lk-d-strong" x="64" y="138">This repository</text>
  <text class="lk-d-code-muted" x="64" y="158">lorekeeper/</text>
  <text class="lk-d-note" x="64" y="186">the CLI, its contracts, and its tests</text>
  <text class="lk-d-note" x="64" y="204">the identity, the narrative, and this diagram</text>
  <text class="lk-d-note" x="64" y="222">MIT licensed, and holding no brain data</text>

  <path class="lk-d-flow" d="M 432,196 L 522,196" marker-end="url(#lk-d-ts-arrow)"/>
  <text class="lk-d-note-sm lk-d-mid" x="480" y="186">builds</text>

  <rect class="lk-d-node" x="528" y="108" width="384" height="176" rx="8"/>
  <text class="lk-d-strong" x="544" y="138">The documentation site</text>
  <text class="lk-d-code-muted" x="544" y="158">static, installable</text>
  <text class="lk-d-note" x="544" y="186">renders what this repository authors</text>
  <text class="lk-d-note" x="544" y="204">no server, no accounts, no credentials</text>
  <text class="lk-d-note" x="544" y="222">holds no brain data</text>

  <!-- the boundary: open once, for code going down; struck through for data coming up -->
  <text class="lk-d-warn lk-d-mid" x="480" y="322">No brain data crosses this line. Nothing private is committed here.</text>
  <path class="lk-d-boundary" d="M 48,340 L 112,340"/>
  <path class="lk-d-boundary" d="M 168,340 L 912,340"/>

  <text class="lk-d-step" x="48" y="372">PRIVATE</text>

  <rect class="lk-d-node" x="232" y="384" width="496" height="180" rx="8"/>
  <text class="lk-d-strong" x="248" y="414">Your brain</text>
  <text class="lk-d-code-muted" x="248" y="434">~/brain</text>
  <text class="lk-d-note" x="248" y="462">your Markdown files, and the manifest that says</text>
  <text class="lk-d-note" x="248" y="480">which of them the toolkit owns</text>
  <text class="lk-d-note" x="248" y="510">private, on your machine, generated by lore init</text>
  <text class="lk-d-note" x="248" y="528">never committed to this repository</text>

  <!-- code crosses downwards, through the one opening -->
  <path class="lk-d-flow" d="M 140,284 L 140,420 L 226,420" marker-end="url(#lk-d-ts-arrow)"/>
  <text class="lk-d-code-accent" x="48" y="450">lore init</text>
  <text class="lk-d-code-accent" x="48" y="468">lore capture</text>
  <text class="lk-d-code-accent" x="48" y="486">lore search</text>
  <text class="lk-d-note-sm" x="48" y="508">run on your machine</text>

  <!-- data does not cross back -->
  <path class="lk-d-blocked" d="M 728,420 L 820,420 L 820,290" marker-end="url(#lk-d-ts-arrow-no)"/>
  <path class="lk-d-cross" d="M 809,329 L 831,351"/>
  <path class="lk-d-cross" d="M 831,329 L 809,351"/>
  <text class="lk-d-warn" x="744" y="450">Your notes</text>
  <text class="lk-d-warn" x="744" y="468">never cross.</text>
  <text class="lk-d-note-sm" x="744" y="494">The CLI makes no</text>
  <text class="lk-d-note-sm" x="744" y="512">network call.</text>

  <text class="lk-d-foot" x="48" y="596">No private or personal content enters this repository — fixtures, demos, and screenshots included.</text>
</svg>
